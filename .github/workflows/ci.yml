name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; jobs that need more request it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Blocking gate: the workspace must build and unit/lib tests must pass ----
  build-test:
    name: Build & test
    runs-on: ubuntu-24.04
    # Cached runs take ~6-8 min. Backstop for a test binary that never exits
    # (e.g. a libFuzzer harness run by `--bins`; the guard below prevents the
    # known case) instead of the 6 h default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # aws-lc-rs (PQC / crypto) builds C/asm; install its toolchain.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev golang-go perl pkg-config nasm protobuf-compiler libssl-dev
          go version

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # fuzz/ (ostrich-fuzz) is a member of this workspace and shares
      # Cargo.lock, so `--locked` on Build and Clippy covers the fuzz graph and
      # any stale lock fails there. This guard keeps the one-lockfile layout
      # and its exclusions from regressing:
      #  1. no committed fuzz/Cargo.lock;
      #  2. ostrich-fuzz is a workspace member;
      #  3. no test/coverage command in a workflow, the Makefile or
      #     .gitlab-ci.yml selects the fuzz bins: a line running cargo's test
      #     or tarpaulin subcommand with `--bins` / `--all-targets` (or any
      #     tarpaulin line) needs `--exclude ostrich-fuzz` unless it selects
      #     packages with -p/--package. `--bins` overrides the bins'
      #     `test = false`, and a fuzz bin's test binary is libFuzzer's main,
      #     which never exits. Single-line commands only;
      #  4. the root Dockerfile's OSTRICH_RELEASE_PACKAGES (cargo-chef cook has
      #     no --exclude) is exactly the workspace members minus ostrich-fuzz,
      #     so the release image keeps `--workspace` feature unification.
      # Cheap (`--no-deps`: workspace manifests only, no dependency
      # resolution, so it does not itself detect a stale lock); runs first.
      # COMPLIANCE MAPPING:
      # - NIST 800-53: CM-2 (Baseline Configuration), CM-3 (Configuration
      #   Change Control), SI-2 (Flaw Remediation), SR-3 - one lockfile for
      #   the workspace and the fuzz harness (POAM-2026-10-23-60)
      - name: Fuzz crate shares the root lockfile
        run: |
          set -euo pipefail
          rc=0
          if git ls-files --error-unmatch fuzz/Cargo.lock >/dev/null 2>&1; then
            echo "::error file=fuzz/Cargo.lock::fuzz/ is a root workspace member; delete fuzz/Cargo.lock"
            rc=1
          fi
          members="$(mktemp)"
          cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[].name' | sort > "$members"
          if ! grep -qx ostrich-fuzz "$members"; then
            echo "::error file=Cargo.toml::ostrich-fuzz must be a root workspace member"
            rc=1
          fi

          # (3) Lines of tracked CI/Make files that run the test or tarpaulin
          # subcommand. The pattern needs whitespace after "cargo", so this
          # script's own lines never match it.
          files="$(mktemp)"
          git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml' Makefile .gitlab-ci.yml > "$files"
          while IFS= read -r -d '' f; do
            hits="$(grep -nE 'cargo[[:space:]]+(\+[^[:space:]]+[[:space:]]+)?(test|tarpaulin)([[:space:]]|$)' "$f")" || [ $? -eq 1 ]
            while IFS= read -r hit; do
              [ -n "$hit" ] || continue
              line="${hit#*:}"
              [[ "$line" =~ ^[[:space:]]*# ]] && continue
              [[ "$line" =~ --bins|--all-targets|tarpaulin ]] || continue
              [[ "$line" =~ --exclude[[:space:]=]+ostrich-fuzz ]] && continue
              if [[ "$line" =~ (^|[[:space:]])(-p|--package)([[:space:]=]) ]] && [[ ! "$line" =~ ostrich-fuzz ]]; then
                continue
              fi
              echo "::error file=$f,line=${hit%%:*}::selects the fuzz bins (--bins/--all-targets/tarpaulin) without --exclude ostrich-fuzz; libFuzzer harnesses never exit"
              rc=1
            done <<< "$hits"
          done < "$files"

          # (4) Root Dockerfile release selection. Parsed the way Docker reads
          # it: comment lines dropped (also inside a continuation), then `\`
          # continuations joined. Exactly one ENV OSTRICH_RELEASE_PACKAGES, equal
          # to the members minus ostrich-fuzz; exactly one `cargo chef cook`
          # and one `cargo build` RUN line, both using $OSTRICH_RELEASE_PACKAGES
          # and neither selecting `--workspace` or ostrich-fuzz.
          joined="$(mktemp)"
          grep -v '^[[:space:]]*#' Dockerfile \
            | awk '{ if (sub(/\\$/, "")) { buf = buf $0 } else { print buf $0; buf = "" } } END { if (buf != "") print buf }' > "$joined"
          want="$(mktemp)"; got="$(mktemp)"
          grep -vx ostrich-fuzz "$members" > "$want"
          envs="$(grep -cE '^ENV[[:space:]]+OSTRICH_RELEASE_PACKAGES=' "$joined")" || true
          if [ "$envs" != 1 ]; then
            echo "::error file=Dockerfile::expected exactly one ENV OSTRICH_RELEASE_PACKAGES, found $envs"
            rc=1
          fi
          grep -E '^ENV[[:space:]]+OSTRICH_RELEASE_PACKAGES=' "$joined" \
            | grep -oE -- '-p [A-Za-z0-9_-]+' | cut -d' ' -f2 | sort > "$got" || true
          if ! diff -u "$want" "$got"; then
            echo "::error file=Dockerfile::OSTRICH_RELEASE_PACKAGES must list every workspace member except ostrich-fuzz (diff above: - missing, + extra)"
            rc=1
          fi
          for step in "chef cook" build; do
            re="^RUN[[:space:]].*cargo[[:space:]]+${step// /[[:space:]]+}([[:space:]]|\$)"
            runs="$(grep -E "$re" "$joined")" || true
            n="$(printf '%s' "$runs" | grep -c . || true)"
            if [ "$n" != 1 ]; then
              echo "::error file=Dockerfile::expected exactly one RUN line with cargo $step, found $n"
              rc=1
              continue
            fi
            if [[ "$runs" != *"\$OSTRICH_RELEASE_PACKAGES"* ]] || [[ "$runs" =~ --workspace|ostrich-fuzz ]]; then
              echo "::error file=Dockerfile::the cargo $step RUN line must use \$OSTRICH_RELEASE_PACKAGES and must not contain --workspace or ostrich-fuzz: $runs"
              rc=1
            fi
          done
          exit "$rc"

      - name: Build
        run: cargo build --workspace --locked

      # Unit/lib + binary tests only (live e2e modules skip here). The PKCS#11
      # / SoftHSM suite runs in .github/workflows/hsm-integration.yml; the
      # PostgreSQL + SoftHSM live suites run in integration-db.yml.
      # ostrich-fuzz is excluded: `--bins` overrides its `test = false`, and a
      # fuzz bin's test binary is libFuzzer's main, which never exits. Build
      # and Clippy still compile all fuzz targets on stable.
      - name: Test
        run: cargo test --workspace --exclude ostrich-fuzz --lib --bins --locked

      # CA gRPC mTLS end-to-end (in-process TLS 1.3 mTLS server/client, the
      # dev cert script, per-role / per-method authorization, requestor
      # binding, issuer profile allowlists) and the process FIPS gate.
      # Self-contained: no Postgres, no network services; needs bash + openssl
      # (preinstalled on ubuntu-24.04). OSTRICH_DB_TESTS is deliberately unset,
      # so DB-backed suites stay skipped here.
      # COMPLIANCE MAPPING:
      # - NIST 800-53: SA-11 (Developer Testing), SC-8, AC-17, IA-3, SC-13
      - name: Test CA gRPC mTLS and FIPS gate
        run: >-
          cargo test -p ostrich-integration-tests
          --test grpc_mtls_e2e --test fips_gate_preinstalled --locked

  # ---- React frontend (the web-ui console) ----
  # Builds the services/web-ui/web SPA and enforces the npm supply-chain
  # controls. This is the deployed console (the former Yew/WASM client was
  # retired in the /next → / cutover).
  #
  # COMPLIANCE MAPPING:
  # - NIST 800-53: CM-2  (Baseline Configuration) — frozen-lockfile install
  # - NIST 800-53: RA-5  (Vulnerability Monitoring) — pnpm audit gate
  # - NIST 800-53: SI-7 / SA-12 (Integrity / Supply Chain) — CycloneDX SBOM
  # - NIST 800-53: SI-2 / SA-22 (Flaw Remediation / Unsupported Components) —
  #   Node 24 LTS from web/.nvmrc, the same major as the Dockerfile builders
  #   (POAM-2026-10-23-58)
  web-ui-react:
    name: Web UI (React build + supply-chain)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/web-ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Latest Node 24 LTS patch. vite 8 / rolldown need >=20.19 or >=22.12
          # (web/package.json engines); toolchain-pin keeps the Dockerfile
          # node:<major> images on the same major.
          node-version-file: services/web-ui/web/.nvmrc
      - name: Enable pnpm (corepack; version pinned by packageManager)
        run: corepack enable
      - name: Install (frozen lockfile — CM-2)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build
      - name: Audit production dependencies (RA-5)
        run: pnpm audit --prod --audit-level=high
      # SBOM via cdxgen (pnpm-aware). Best-effort during P1 (the tool is heavy);
      # hardens to a required step at cutover. The audit step above is the
      # blocking supply-chain gate.
      - name: Generate CycloneDX SBOM (SI-7 / SA-12)
        continue-on-error: true
        run: pnpm dlx @cyclonedx/cdxgen@^11 -t pnpm --no-recurse -o sbom.web-ui.json .
      - name: Upload SBOM artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-ui-sbom
          path: services/web-ui/web/sbom.web-ui.json
          if-no-files-found: ignore

  # ---- Advisory checks (non-blocking for now) ----
  # These surface drift without failing PRs while pre-existing debt is paid down:
  #   * rustfmt: the tree is not yet fully `cargo fmt`-normalized (~231 files).
  #   * clippy:  a handful of pre-existing warnings remain across some crates.
  # Once both are clean, drop `continue-on-error` to make them required gates.
  clippy:
    name: Clippy (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev golang-go perl pkg-config nasm protobuf-compiler libssl-dev
          go version
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rustfmt:
    name: Rustfmt (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - run: cargo fmt --all --check

  # ---- Toolchain pin consistency (blocking) ----
  # COMPLIANCE MAPPING:
  # - NIST 800-53: CM-2 (Baseline Configuration), SA-15 (Development Tools)
  # Scans every tracked Dockerfile* and .gitlab-ci.yml. Every rust:<tag> image
  # token (any form: rust:latest, rust:1.98, rust:1.98.0-slim, ...) must start
  # with rust:<channel>- from rust-toolchain.toml, and a file that builds Rust
  # (mentions cargo; always .gitlab-ci.yml) must contain at least one. Catches
  # e.g. a Dependabot docker bump that did not also bump the toolchain file, or
  # a new service Dockerfile on a different tag.
  toolchain-pin:
    name: Toolchain pin consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rust image tags match rust-toolchain.toml (CM-2)
        run: |
          set -euo pipefail
          want="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          test -n "$want" || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          # -z: NUL-separated, unquoted paths (non-ASCII/quoted names are not skipped).
          rc=0; n=0
          while IFS= read -r -d '' f; do
            n=$((n + 1))
            [ -f "$f" ] || { echo "::error::unreadable $f"; rc=1; continue; }
            # Every rust:<tag> image token (any tag form, incl. rust:latest, rust:1.98).
            refs="$(grep -nEo '(^|[[:space:]/="'\''])rust:[^[:space:]"'\'']+' "$f" | sed -E 's|^([0-9]+:)[[:space:]/="'\'']?|\1|' || true)"
            if [ -z "$refs" ]; then
              # A file that builds Rust must take its toolchain from a pinned rust image.
              if [ "$f" = .gitlab-ci.yml ] || grep -qw cargo "$f"; then
                echo "::error file=$f::builds Rust but has no rust:<tag> image reference"; rc=1
              fi
              continue
            fi
            while IFS= read -r r; do
              tok="${r#*:}"
              case "$tok" in
                "rust:${want}-"*) echo "ok   $f:$r" ;;
                *) echo "::error file=$f,line=${r%%:*}::$tok does not match rust-toolchain.toml (rust:${want}-<suffix>)"; rc=1 ;;
              esac
            done <<< "$refs"
          done < <(git ls-files -z '*Dockerfile*' .gitlab-ci.yml)
          [ "$n" -gt 0 ] || { echo "::error::no Dockerfiles or .gitlab-ci.yml tracked"; exit 1; }
          exit "$rc"

      # Node builder images (Dockerfile*, .gitlab-ci.yml) run the same major
      # as the CI web job (services/web-ui/web/.nvmrc), pinned by digest.
      # Backslash-continued lines are joined first; comment lines are
      # skipped. On every other (logical) line:
      #  (a) every node:<tag> / node@<digest> token (FROM, ARG, COPY --from=,
      #      RUN --mount from=, image:, ...) must be
      #      node:<major>.<...>@sha256:<64 hex> or
      #      node:<major>-<...>@sha256:<64 hex>, so a tag-only or digest-only
      #      ref, node:latest or another major fails;
      #  (b) a tagless node repository (node, docker.io/library/node) fails as
      #      a FROM / image: value, a --from= / from= value or an ARG default;
      #  (c) a FROM whose image is a variable ($VAR, ${VAR}) fails, because
      #      the gate cannot resolve it. No tracked Dockerfile does this
      #      today; a reviewed exception goes on the line directly above as
      #      the comment "# toolchain-pin: allow".
      # COMPLIANCE MAPPING:
      # - NIST 800-53: CM-2 (Baseline Configuration), SA-22 (Unsupported
      #   System Components), SR-3 (Supply Chain Controls) -
      #   POAM-2026-10-23-58
      - name: node images pinned by digest on the services/web-ui/web/.nvmrc major (CM-2)
        run: |
          set -euo pipefail
          want="$(tr -d '[:space:]' < services/web-ui/web/.nvmrc)"
          want="${want#v}"
          [[ "$want" =~ ^[1-9][0-9]*$ ]] || { echo "::error file=services/web-ui/web/.nvmrc::must hold a bare Node major (e.g. 24), got '$want'"; exit 1; }
          pin_re="^node:${want}[.-][^@]*@sha256:[0-9a-f]{64}$"
          rc=0; n=0
          bad() { echo "::error file=$1,line=$2::$3"; rc=1; }
          # Tagless node repository: basename exactly "node" (a tag or digest
          # makes the basename differ; those are rule (a)'s job).
          tagless() { local v="${1//[\"\']/}"; [ "${v##*/}" = node ]; }
          check() { # line number, logical line; file name in $cur
            local f="$cur" ln="$1" line="$2" tok img v
            # (a) node:<tag> and node@<digest> tokens anywhere on the line.
            while IFS= read -r tok; do
              [ -n "$tok" ] || continue
              n=$((n + 1))
              if [[ "$tok" =~ $pin_re ]]; then
                echo "ok   $f:$ln:$tok"
              else
                bad "$f" "$ln" "$tok must be node:${want}.<...>@sha256:<64 hex> or node:${want}-<...>@sha256:<64 hex> (major from services/web-ui/web/.nvmrc)"
              fi
            done < <(grep -Eo '(^|[[:space:]/=,"'\''])node[:@][^[:space:],"'\'']+' <<< "$line" | sed -E 's|^[[:space:]/=,"'\'']||' || true)
            # (b) FROM / image: value, --from= / from= values, ARG default.
            img="$(sed -nE 's/^[[:space:]]*[Ff][Rr][Oo][Mm][[:space:]]+(--[^[:space:]]+[[:space:]]+)*([^[:space:]]+).*/\2/p; s/^[[:space:]-]*image:[[:space:]]*([^[:space:]]+).*/\1/p' <<< "$line")"
            if [ -n "$img" ] && tagless "$img"; then n=$((n + 1)); bad "$f" "$ln" "$img has no tag or digest (pin node:${want}.<...>@sha256:<64 hex>)"; fi
            while IFS= read -r v; do
              [ -n "$v" ] || continue
              if tagless "$v"; then n=$((n + 1)); bad "$f" "$ln" "from=$v names a tagless node image (pin node:${want}.<...>@sha256:<64 hex>)"; fi
            done < <(grep -Eo '(^|[[:space:],])(--)?from=[^[:space:],]+' <<< "$line" | sed -E 's|^[[:space:],]*(--)?from=||' || true)
            v="$(sed -nE 's/^[[:space:]]*[Aa][Rr][Gg][[:space:]]+[A-Za-z_][A-Za-z0-9_]*=([^[:space:]]+).*/\1/p' <<< "$line")"
            if [ -n "$v" ] && tagless "$v"; then n=$((n + 1)); bad "$f" "$ln" "ARG default $v is a tagless node image (pin node:${want}.<...>@sha256:<64 hex>)"; fi
            # (c) FROM with a variable image (Dockerfiles only).
            case "$f" in
              *Dockerfile*)
                if [[ "$img" == *'$'* ]] && [ "$allow" -eq 0 ]; then
                  bad "$f" "$ln" "FROM $img: variable base images cannot be checked; use a literal pinned ref, or put '# toolchain-pin: allow' on the line above after review"
                fi ;;
            esac
          }
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || { echo "::error::unreadable $f"; rc=1; continue; }
            cur="$f"; ln=0; start=0; acc=""; allow=0; pend=0
            while IFS= read -r -u 3 line || [ -n "$line" ]; do
              ln=$((ln + 1))
              if [[ "$line" =~ ^[[:space:]]*# ]]; then
                # Comments inside a continued instruction are dropped, as Docker does.
                if [ -z "$acc" ] && [[ "$line" =~ ^[[:space:]]*#[[:space:]]*toolchain-pin:[[:space:]]*allow[[:space:]]*$ ]]; then
                  pend=1
                fi
                continue
              fi
              if [ -z "$acc" ]; then
                start=$ln; allow=$pend; pend=0
              fi
              if [[ "$line" =~ \\[[:space:]]*$ ]]; then
                acc+="${line%\\*} "
                continue
              fi
              acc+="$line"
              check "$start" "$acc"
              acc=""
            done 3< "$f"
            [ -z "$acc" ] || check "$start" "$acc"
          done < <(git ls-files -z '*Dockerfile*' .gitlab-ci.yml)
          [ "$n" -gt 0 ] || { echo "::error::no node image reference found in the tracked Dockerfiles"; exit 1; }
          exit "$rc"

  # ---- Node builder stages of the Dockerfiles (blocking when they change) ----
  # PR CI otherwise never builds the images (docker-publish.yml runs on push
  # and tags only), and no other job builds the npe-portal SPA. Builds only
  # the two Node stages, which need nothing but the digest-pinned node image
  # and their web/ sources: no registry login, no secrets, no Iron Bank
  # base, no push (`--output type=cacheonly`), no cache export. On a PR the
  # job always runs and reports success when no input changed, so it can be
  # made a required check. On a push to main it always builds: main only
  # moves by merge, the PR run is the gate, and an unconditional build gives
  # a post-merge record without fetching github.event.before (which may lie
  # outside the shallow checkout of a multi-commit push).
  # COMPLIANCE MAPPING:
  # - NIST 800-53: CM-3 (Configuration Change Control), SI-2, SA-22, SR-3 -
  #   the node:24 builders are exercised before merge (POAM-2026-10-23-58)
  # - NIST 800-53: CM-6 / AC-6 - contents: read token, no credentials
  docker-node-stages:
    name: Docker build stages (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Depth 2: on a PR, HEAD is the merge commit and HEAD^1 the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Detect changes to the Node builder inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME: building unconditionally."
            exit 0
          fi
          # NUL-separated, unquoted paths; a rename lists both old and new
          # path. Written to a file first so a git failure fails the job.
          changed="$RUNNER_TEMP/changed-paths"
          git diff --no-renames -z --name-only HEAD^1 HEAD > "$changed"
          build=false
          while IFS= read -r -d '' path; do
            printf '%s\n' "$path"
            if [[ "$path" =~ ^(Dockerfile|services/web-ui/Dockerfile|services/[^/]+/web/.*|\.dockerignore|\.github/workflows/ci\.yml)$ ]]; then
              build=true
            fi
          done < "$changed"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "No Node builder input changed; nothing to build."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Do not write the buildx binary to the Actions cache.
          cache-binary: false

      - name: Build services/web-ui/Dockerfile --target web-builder
        if: steps.changes.outputs.build == 'true'
        run: docker buildx build --progress=plain -f services/web-ui/Dockerfile --target web-builder --output type=cacheonly .

      - name: Build Dockerfile --target npe-portal-web-builder
        if: steps.changes.outputs.build == 'true'
        run: docker buildx build --progress=plain -f Dockerfile --target npe-portal-web-builder --output type=cacheonly .

  # ---- Rust builder stages of the Dockerfiles (blocking when they change) ----
  # docker-publish.yml builds the images on push to main and tags only, so a
  # Dockerfile or workspace-manifest change (e.g. a new workspace member whose
  # manifest is not COPY'd, a package selection that drifts) would otherwise
  # first fail after merge. Cargo.lock is deliberately not an input: a
  # lock-only change (every Dependabot cargo PR) only moves dependency
  # versions, which `Build & test` already compiles with `--locked`, and two
  # cold ~1 h release builds per such PR would add cost, not coverage.
  # docker-publish.yml builds every push to main in full. Builds the
  # Rust builder stages only: `builder` (chef <- rust:<toolchain>-bookworm,
  # planner) and `server-builder` (server-chef, server-planner). Neither
  # reaches the Iron Bank runtime base, so: no registry login, no secrets, no
  # push (`--output type=cacheonly`), no cache export. One matrix job per
  # Dockerfile so the two cold release builds run in parallel. Each leg builds
  # only when its own Dockerfile or a shared input (.dockerignore, root or
  # fuzz Cargo.toml, rust-toolchain.toml, this file) changed. On a PR every leg
  # always runs and reports success when none of its inputs changed, so both
  # can be made required checks. On a push to main it does not build: docker-publish.yml
  # builds both Dockerfiles in full on every push to main (the post-merge
  # record), and a second cold release build here would only double that cost.
  # COMPLIANCE MAPPING:
  # - NIST 800-53: CM-3 (Configuration Change Control), CM-2, SA-10, SR-3 -
  #   the release builder stages are exercised before merge
  #   (POAM-2026-10-23-60)
  # - NIST 800-53: CM-6 / AC-6 - contents: read token, no credentials
  docker-rust-stages:
    name: Docker build stages (Rust, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    # Cold release build (fat LTO, codegen-units = 1, aws-lc FIPS module) with
    # no layer cache; docker-publish (registry cache) takes ~20 min.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: services
            dockerfile: Dockerfile
            target: builder
          - name: web-ui
            dockerfile: services/web-ui/Dockerfile
            target: server-builder
    steps:
      # Depth 2: on a PR, HEAD is the merge commit and HEAD^1 the base tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # Per leg: its own Dockerfile, plus the shared inputs, trigger a build.
      - name: Detect changes to the Rust builder inputs
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != pull_request ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$EVENT_NAME: not building; docker-publish.yml builds both Dockerfiles on push to main."
            exit 0
          fi
          # NUL-separated, unquoted paths; a rename lists both old and new
          # path. Written to a file first so a git failure fails the job.
          changed="$RUNNER_TEMP/changed-paths"
          git diff --no-renames -z --name-only HEAD^1 HEAD > "$changed"
          build=false
          while IFS= read -r -d '' path; do
            printf '%s\n' "$path"
            if [ "$path" = "$DOCKERFILE" ] \
              || [[ "$path" =~ ^(\.dockerignore|Cargo\.toml|fuzz/Cargo\.toml|rust-toolchain\.toml|\.github/workflows/ci\.yml)$ ]]; then
              build=true
            fi
          done < "$changed"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "No Rust builder input of $DOCKERFILE changed; nothing to build."

      - name: Set up Docker Buildx
        if: steps.changes.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Do not write the buildx binary to the Actions cache.
          cache-binary: false

      - name: Build ${{ matrix.dockerfile }} --target ${{ matrix.target }}
        if: steps.changes.outputs.build == 'true'
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: docker buildx build --progress=plain -f "$DOCKERFILE" --target "$TARGET" --output type=cacheonly .

  # NOTE: the dependency gate (cargo audit + cargo deny) lives in its own
  # workflow (.github/workflows/audit.yml). It runs on every PR, on pushes to
  # main and on a weekly schedule, and is blocking.
