[package]
name = "ostrich-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license.workspace = true

[package.metadata]
cargo-fuzz = true

[dependencies]
# Fuzzing library
libfuzzer-sys = "0.4"

# OstrichPKI crates to fuzz
ostrich-x509 = { workspace = true }
ostrich-crypto = { workspace = true }
ostrich-common = { workspace = true }
ostrich-protocol = { workspace = true }
ostrich-acme = { path = "../crates/ostrich-acme" }

# Dependencies for fuzzing targets. This crate is a member of the root
# workspace and shares its Cargo.lock (POAM-2026-10-23-60), so these inherit
# the root `[workspace.dependencies]` versions and features.
# NIST 800-53: CM-2, CM-3, SR-3 (one checksum-pinned graph, audited by
# cargo audit / cargo deny with the rest of the workspace).
x509-cert = { workspace = true }
der = { workspace = true }
pem-rfc7468 = { workspace = true }
serde_json = { workspace = true } # fuzz_jws_signature

# Every bin is a libFuzzer harness (its `main` fuzzes until stopped), so it is
# kept out of plain `cargo test` / `cargo bench` / `cargo doc`. An explicit
# `cargo test --bins` overrides `test = false`: exclude ostrich-fuzz there.
[[bin]]
name = "fuzz_der_certificate"
path = "fuzz_targets/fuzz_der_certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pem_certificate"
path = "fuzz_targets/fuzz_pem_certificate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_der_csr"
path = "fuzz_targets/fuzz_der_csr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_jws_signature"
path = "fuzz_targets/fuzz_jws_signature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ocsp_request"
path = "fuzz_targets/fuzz_ocsp_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ocsp_response"
path = "fuzz_targets/fuzz_ocsp_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_crl_parsing"
path = "fuzz_targets/fuzz_crl_parsing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_grpc_peer_subject"
