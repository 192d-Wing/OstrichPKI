# OstrichPKI Docker Compose - Production Configuration
#
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-2 (Baseline Configuration)
# - NIST 800-53: CM-6 (Configuration Settings)
# - NIST 800-53: SC-8 (Transmission Confidentiality)
#
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d ca acme            # Start specific services
#   docker-compose logs -f ca               # View CA logs
#   docker-compose down                     # Stop all services
#
# PREREQUISITE: CA gRPC mTLS material. The CA gRPC API (50051) only serves
# TLS 1.3 mutual TLS (aws-lc-rs FIPS) with per-role client lists, and the
# CA exits at startup without it (no plaintext fallback in release images).
# For development run `make dev-grpc-certs`; otherwise point CA_GRPC_TLS_DIR,
# ACME_CA_GRPC_CLIENT_DIR and EST_CA_GRPC_CLIENT_DIR in .env at directories
# holding real certificates (see .env.example and docs/runbooks/ca-grpc-mtls.md).
# Each container mounts ONLY its own certificate, key and trust anchor (one
# directory per service, laid out like the Kubernetes secrets: tls.crt, tls.key
# and client-ca.crt / ca.crt), never another service's private key.
# Keep those directories OUTSIDE ./certs: ca, est and ocsp mount ./certs
# wholesale, so anything under it is visible to all three. The DEV ONLY
# default (./.dev-grpc-certs) is outside ./certs for that reason.
# NIST 800-53: SC-8, AC-17, IA-3, AC-3, AC-6 (least privilege), SC-12

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ostrich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ostrich}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ostrich_pki}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ostrich}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ostrich-internal

  # Certificate Authority Service
  ca:
    build:
      context: .
      dockerfile: Dockerfile
      target: ca-service
    container_name: ostrich-ca
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # Bind addresses
      CA_REST_ADDRESS: 0.0.0.0:8080
      CA_GRPC_ADDRESS: 0.0.0.0:50051
      # gRPC mTLS (server identity, client trust anchor, per-role client lists)
      # client-ca.crt must be a dedicated service-identity CA, never the CA's
      # own subscriber-issuing certificate (ca-server refuses to start).
      CA_GRPC_TLS_CERT_FILE: ${CA_GRPC_TLS_CERT_FILE:-/app/grpc-tls/tls.crt}
      CA_GRPC_TLS_KEY_FILE: ${CA_GRPC_TLS_KEY_FILE:-/app/grpc-tls/tls.key}
      CA_GRPC_TLS_CLIENT_CA_FILE: ${CA_GRPC_TLS_CLIENT_CA_FILE:-/app/grpc-tls/client-ca.crt}
      # Per-role ";"-joined RFC 4514 DN lists. ACME/EST = Issuer role (Issue,
      # GetCaInfo, ListProfiles; requestor must be acme::/est::). ADMIN =
      # Revoke/GenerateCrl/CheckRevocationStatus + reads, never Issue; empty
      # by default. A DN may appear in only one list (else refuse to start).
      CA_GRPC_ACME_CLIENT_SUBJECTS: ${CA_GRPC_ACME_CLIENT_SUBJECTS:-CN=acme-server}
      CA_GRPC_EST_CLIENT_SUBJECTS: ${CA_GRPC_EST_CLIENT_SUBJECTS:-CN=est-server}
      CA_GRPC_ADMIN_CLIENT_SUBJECTS: ${CA_GRPC_ADMIN_CLIENT_SUBJECTS:-}
      # Removed variable, forwarded only so a stale .env value makes ca-server
      # refuse to start instead of being silently ignored (blank = unset).
      CA_GRPC_ALLOWED_CLIENT_SUBJECTS: ${CA_GRPC_ALLOWED_CLIENT_SUBJECTS:-}
      # Per-namespace ";"-joined end-entity profiles the ACME / EST Issuer
      # clients may request (else PERMISSION_DENIED + audit). CA profiles
      # (e.g. intermediate_ca) are never allowed; unknown, CA or empty lists
      # for a namespace with subjects refuse startup. NIST 800-53: AC-3, AC-6.
      CA_GRPC_ACME_ALLOWED_PROFILES: ${CA_GRPC_ACME_ALLOWED_PROFILES:-acme-default}
      CA_GRPC_EST_ALLOWED_PROFILES: ${CA_GRPC_EST_ALLOWED_PROFILES:-tls_client;tls_server;tls_server_client;efs}
      # CA Configuration
      CA_CERT_FILE: ${CA_CERT_FILE:-}
      CA_KEY_FILE: ${CA_KEY_FILE:-}
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      # ./certs is mounted whole: never put gRPC key material under it (the
      # dev default ./.dev-grpc-certs is outside it; see CA_GRPC_TLS_DIR etc.).
      - ./certs:/app/certs:ro
      - ./config:/app/config:ro
      # CA gRPC server material ONLY: tls.crt, tls.key, client-ca.crt (default:
      # DEV ONLY ./.dev-grpc-certs/ca-server from `make dev-grpc-certs`; point
      # CA_GRPC_TLS_DIR at real files outside development). No client keys.
      # Long syntax: a missing directory is an error, not an empty mount.
      - type: bind
        source: ${CA_GRPC_TLS_DIR:-./.dev-grpc-certs/ca-server}
        target: /app/grpc-tls
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal
      - ostrich-external

  # ACME Protocol Service (RFC 8555)
  acme:
    build:
      context: .
      dockerfile: Dockerfile
      target: acme-service
    container_name: ostrich-acme
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ca:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # ACME Configuration
      ACME_BIND_ADDRESS: 0.0.0.0:8080
      ACME_BASE_URL: ${ACME_BASE_URL:-http://localhost:8080}
      # dns-01 resolvers; empty (default) = container system resolvers (see .env.example)
      ACME_DNS01_RESOLVERS: ${ACME_DNS01_RESOLVERS:-}
      # CA gRPC client (TLS 1.3 mTLS, subject must be in CA_GRPC_ACME_CLIENT_SUBJECTS)
      CA_GRPC_URL: ${ACME_CA_GRPC_URL:-https://ca:50051}
      CA_GRPC_CLIENT_CERT_FILE: ${ACME_CA_GRPC_CLIENT_CERT_FILE:-/app/ca-grpc-client/tls.crt}
      CA_GRPC_CLIENT_KEY_FILE: ${ACME_CA_GRPC_CLIENT_KEY_FILE:-/app/ca-grpc-client/tls.key}
      CA_GRPC_CA_CERT_FILE: ${ACME_CA_GRPC_CA_CERT_FILE:-/app/ca-grpc-client/ca.crt}
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    volumes:
      # CA gRPC client material ONLY for acme-server: tls.crt, tls.key and ca.crt
      # (server trust anchor). Default: DEV ONLY ./.dev-grpc-certs/acme-server from
      # `make dev-grpc-certs`; point ACME_CA_GRPC_CLIENT_DIR at real files.
      # Long syntax: a missing directory is an error, not an empty mount.
      - type: bind
        source: ${ACME_CA_GRPC_CLIENT_DIR:-./.dev-grpc-certs/acme-server}
        target: /app/ca-grpc-client
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal
      - ostrich-external

  # EST Enrollment Service (RFC 7030)
  est:
    build:
      context: .
      dockerfile: Dockerfile
      target: est-service
    container_name: ostrich-est
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ca:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # EST Configuration
      EST_BIND_ADDRESS: 0.0.0.0:8443
      # CA gRPC client (TLS 1.3 mTLS, subject must be in CA_GRPC_EST_CLIENT_SUBJECTS)
      CA_GRPC_URL: ${EST_CA_GRPC_URL:-https://ca:50051}
      CA_GRPC_CLIENT_CERT_FILE: ${EST_CA_GRPC_CLIENT_CERT_FILE:-/app/ca-grpc-client/tls.crt}
      CA_GRPC_CLIENT_KEY_FILE: ${EST_CA_GRPC_CLIENT_KEY_FILE:-/app/ca-grpc-client/tls.key}
      CA_GRPC_CA_CERT_FILE: ${EST_CA_GRPC_CA_CERT_FILE:-/app/ca-grpc-client/ca.crt}
      # TLS Configuration
      TLS_CERT_FILE: ${EST_TLS_CERT_FILE:-}
      TLS_KEY_FILE: ${EST_TLS_KEY_FILE:-}
      TLS_CA_CERT_FILE: ${EST_TLS_CA_CERT_FILE:-}
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8443:8443"
    volumes:
      # ./certs is mounted whole: never put gRPC key material under it (the
      # dev default ./.dev-grpc-certs is outside it; see CA_GRPC_TLS_DIR etc.).
      - ./certs:/app/certs:ro
      # CA gRPC client material ONLY for est-server: tls.crt, tls.key and ca.crt
      # (server trust anchor). Default: DEV ONLY ./.dev-grpc-certs/est-server from
      # `make dev-grpc-certs`; point EST_CA_GRPC_CLIENT_DIR at real files.
      # Long syntax: a missing directory is an error, not an empty mount.
      - type: bind
        source: ${EST_CA_GRPC_CLIENT_DIR:-./.dev-grpc-certs/est-server}
        target: /app/ca-grpc-client
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8443/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal
      - ostrich-external

  # OCSP Responder (RFC 6960)
  ocsp:
    build:
      context: .
      dockerfile: Dockerfile
      target: ocsp-service
    container_name: ostrich-ocsp
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # OCSP Configuration
      OCSP_BIND_ADDRESS: 0.0.0.0:8081
      OCSP_SIGNING_CERT: ${OCSP_SIGNING_CERT:-}
      OCSP_SIGNING_KEY: ${OCSP_SIGNING_KEY:-}
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8081:8081"
    volumes:
      # ./certs is mounted whole: never put gRPC key material under it (the
      # dev default ./.dev-grpc-certs is outside it; see CA_GRPC_TLS_DIR etc.).
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal
      - ostrich-external

  # Smartcard Management System
  scms:
    build:
      context: .
      dockerfile: Dockerfile
      target: scms-service
    container_name: ostrich-scms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # SCMS Configuration
      SCMS_BIND_ADDRESS: 0.0.0.0:8082
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal

  # Key Recovery Authority
  kra:
    build:
      context: .
      dockerfile: Dockerfile
      target: kra-service
    container_name: ostrich-kra
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-ostrich}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ostrich_pki}
      # KRA Configuration
      KRA_BIND_ADDRESS: 0.0.0.0:8083
      # Logging
      RUST_LOG: ${RUST_LOG:-info}
      LOG_JSON: ${LOG_JSON:-true}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ostrich-internal

volumes:
  postgres_data:
    driver: local

networks:
  ostrich-internal:
    name: ostrich-internal
    internal: true
  ostrich-external:
    name: ostrich-external
