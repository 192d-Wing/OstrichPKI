# cargo-deny configuration for OstrichPKI (schema: cargo-deny >= 0.18; verified with 0.20.2)
#
# COMPLIANCE MAPPING:
# - NIST 800-53: RA-5 (Vulnerability Monitoring and Scanning) - [advisories]
# - NIST 800-53: SI-2 (Flaw Remediation) - [advisories]
# - NIST 800-53: SA-10 (Developer Configuration Management)
# - NIST 800-53: SR-3 (Supply Chain Controls), SR-4 (Provenance) - [sources], [licenses]
# - NIST 800-53: SR-11 (Component Authenticity) - [sources]
# - NIST 800-53: SR-11 / SA-15 - integrity of CI tooling (SHA-pinned actions, checksum-verified binaries); not TOE SI-7
#
# Policy: every exception below carries a rationale. Advisory ignores MUST be
# kept identical to `.cargo/audit.toml` (the triage record of posture); a CI
# reviewer should reject a change that edits one list without the other.

[graph]
# Empty = evaluate every target triple (strictest).
targets = []
# Evaluate the full feature set, matching `make clippy` / `make test`
# (`--all-features`), so feature-gated dependencies are policy-checked too.
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories (RA-5, SI-2). Vulnerability and unsound advisories always error.
# ---------------------------------------------------------------------------
[advisories]
version = 2
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Report unmaintained crates anywhere in the graph (matches cargo-audit, which
# reports them as warnings that `--deny warnings` turns into failures).
unmaintained = "all"
yanked = "deny"
# Mirror of .cargo/audit.toml - see that file for the full triage notes.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing side-channel; no patched release. Used only for RSA signature verification (openidconnect) and JWS signing (ACME account keys, tests/benches); no PKCS#1 v1.5 decryption oracle is exposed. Risk accepted; POAM-2026-10-23-09." },
    { id = "RUSTSEC-2026-0097", reason = "rand 0.8.5: rand::thread_rng unsound only when a custom `log` logger draws from ThreadRng; our loggers (tracing) do not. Transitive via cookie/async-nats/num-bigint-dig. POAM-2026-10-23-11: remove after bumping rand to 0.8.6 (patched)." },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitive build-time proc-macro via cryptoki. No runtime code; no replacement upstream yet. SA-22 acceptance, POAM-2026-10-23-12." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via axum-server. PEM parsing of operator-supplied TLS config only; track axum-server migration to rustls-pki-types. SA-22 acceptance, POAM-2026-10-23-12." },
]
maximum-db-staleness = "P30D"
git-fetch-with-cli = false

# ---------------------------------------------------------------------------
# Licenses (SR-3, SR-4). cargo-deny >= 0.18 denies any license that is not in
# `allow` (or a per-crate exception); copyleft (GPL/LGPL/AGPL) is therefore
# rejected implicitly. Unlicensed crates always error.
# ---------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.8
# Narrow, per-crate allowances for licenses we do not accept workspace-wide.
exceptions = [
    # The FIPS 140-3 AWS-LC module (SC-13). Its expression is
    # "ISC AND (Apache-2.0 OR ISC) AND OpenSSL"; the OpenSSL license is a
    # permissive BSD-style license with an advertising/attribution clause.
    # Accepted for this crate only; attribution belongs in release NOTICE.
    { allow = ["OpenSSL"], crate = "aws-lc-fips-sys" },
    # Mozilla root-store data bundles. CDLA-Permissive-2.0 is a permissive data
    # license (no copyleft). Pulled transitively (async-nats via
    # tokio-websockets, hyper-rustls/reqwest, rustls-platform-verifier).
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
    # MIT No Attribution (OSI-approved; MIT minus the attribution clause).
    # Scoped to borrow-or-share (fluent-uri -> referencing -> jsonschema) by
    # decision of 2026-10-23 rather than allowed workspace-wide.
    { allow = ["MIT-0"], crate = "borrow-or-share" },
]

[licenses.private]
# Workspace crates are still license-checked (each declares
# `license.workspace = true`); do not skip unpublished crates.
ignore = false
registries = []

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources (SR-4, SR-11): crates.io only; no git dependencies.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
