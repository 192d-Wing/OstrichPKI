# OstrichPKI profile for disposable usg-est-issuer conformance clusters.
# Never use these settings or credentials in a persistent environment.
image:
  pullPolicy: IfNotPresent

ca:
  bootstrap:
    enabled: true
    existingSecret: ostrich-ci-bootstrap
    adminUsername: integration.lab.example.mil
    keyType: EcP384
    commonName: OstrichPKI EST Issuer Integration Root
  hsm:
    existingSecret: ostrich-ci-bootstrap
    tokenPersistence:
      enabled: true
      size: 256Mi
  requireApproval: false
  # CA gRPC mTLS (required; rendering fails without it). The CI pipeline must
  # create this secret before `helm install`, e.g. from
  # `scripts/gen-dev-grpc-certs.sh --san DNS:<release-fullname>-ca`; see
  # docs/runbooks/ca-grpc-mtls.md "Disposable CI clusters".
  grpc:
    tls:
      existingSecret: ostrich-ci-ca-grpc-tls
    allowedClientSubjects:
      - "CN=est-server"

est:
  allowBearerAuth: false
  allowBasicAuth: true
  tls:
    existingSecret: ostrich-ci-est-tls
    certFile: /app/certs/tls.crt
    keyFile: /app/certs/tls.key
    caCertFile: /app/certs/client-ca.crt
  # EST -> CA gRPC client certificate (CN=est-server, EKU clientAuth).
  caGrpc:
    clientTls:
      existingSecret: ostrich-ci-est-grpc-client

acme:
  enabled: false

npePortal:
  enabled: false

ocsp:
  enabled: false

postgresql:
  primary:
    persistence:
      enabled: false

metrics:
  enabled: false
