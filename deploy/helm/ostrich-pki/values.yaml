# OstrichPKI Helm Chart Values
#
# COMPLIANCE MAPPING:
# - NIST 800-53: CM-6 (Configuration Settings)
# - NIST 800-53: SC-8 (Transmission Confidentiality)
# - NIST 800-53: AC-6 (Least Privilege)

# Global settings
global:
  # Registry override applied to every service image (takes precedence over
  # image.registry below). Leave empty to use image.registry.
  imageRegistry: ""
  # Image pull secrets
  imagePullSecrets: []
  # Storage class for persistent volumes
  storageClass: ""

# Common image settings
#
# Each service is its own image, published as <registry>/<service>-service:<tag>
# by .github/workflows/docker-publish.yml (e.g. ghcr.io/192d-wing/ca-service).
# Per-service `image.repository`/`image.tag` (below) override these defaults.
image:
  registry: ghcr.io/192d-wing
  pullPolicy: Always
  tag: latest  # Pin per environment (e.g. sha-<commit>); empty falls back to appVersion

# Minimal PostgreSQL client used only by database/CA readiness init containers.
# The multi-architecture digest prevents a mutable tag from changing CI or
# production startup behavior.
postgresClientImage:
  repository: docker.io/library/postgres
  tag: 16.10-alpine3.22
  digest: sha256:ab8380566c3ea09690a9ecaa85a59d82bfc6eb86744151a2a54335866c83a3e9
  pullPolicy: IfNotPresent

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod security context (NIST 800-53: AC-6)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container security context (NIST 800-53: AC-6)
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL

# =============================================================================
# Certificate Authority Service
# =============================================================================
ca:
  enabled: true
  replicaCount: 1

  image:
    repository: ""  # Uses global if empty
    tag: ""         # Uses global if empty

  # One-shot HSM-backed CA initialization. Disabled by default so production
  # deployments cannot create a new trust anchor implicitly.
  bootstrap:
    enabled: false
    image:
      repository: ca-init-service
      tag: ""
    existingSecret: ""
    pinKey: pkcs11-pin
    soPinKey: pkcs11-so-pin
    adminPasswordKey: admin-password
    tokenLabel: ostrich-integration
    keyLabel: ostrich-integration-root
    keyType: EcP384
    commonName: OstrichPKI Integration Root CA
    adminUsername: ""
    backoffLimit: 2

  # PKCS#11 settings shared by the bootstrap Job and CA Deployment.
  hsm:
    modulePath: /usr/lib/softhsm/libsofthsm2.so
    existingSecret: ""
    pinKey: pkcs11-pin
    tokenPersistence:
      enabled: false
      existingClaim: ""
      size: 1Gi
      storageClass: ""

  # REST API
  rest:
    port: 8080
    service:
      type: ClusterIP
      port: 8080

  # gRPC issuance API (acme/est -> CA). Always TLS 1.3 mutual TLS via the
  # aws-lc-rs FIPS provider; there is no plaintext mode in release images, so
  # rendering FAILS unless ca.grpc.tls.existingSecret is set (fail closed).
  # See docs/runbooks/ca-grpc-mtls.md.
  # NIST 800-53: SC-8, AC-17, IA-3, IA-5(2), AC-3; NIAP PP-CA: FTP_ITC.1
  grpc:
    port: 50051
    service:
      type: ClusterIP
      port: 50051
    tls:
      # Secret with keys tls.crt (server chain; SAN must include
      # "<fullname>-ca", the host in the in-cluster gRPC URL), tls.key, and
      # client-ca.crt (trust anchor for acme/est/admin client certs). The
      # client CA MUST be a dedicated service-identity CA/intermediate that
      # issues nothing else; ca-server refuses to start if client-ca.crt holds
      # its own subscriber-issuing CA certificate. Client certificates must
      # carry an EKU extension that includes clientAuth.
      # Mounted read-only at /app/grpc-tls.
      existingSecret: ""
      certFile: /app/grpc-tls/tls.crt
      keyFile: /app/grpc-tls/tls.key
      clientCaFile: /app/grpc-tls/client-ca.crt
    # Per-role client-certificate subject DNs (RFC 4514) for the CA gRPC API.
    # Exact, case-sensitive match on the canonical RFC 4514 form; one DN per
    # item, no ";" inside a DN. Each list is passed ";"-joined as
    # CA_GRPC_{ACME,EST,ADMIN}_CLIENT_SUBJECTS. A DN may appear in only one
    # list (rendering fails; ca-server also refuses on a canonical overlap).
    # Unlisted clients, and listed clients calling an RPC their role does not
    # grant (or any unmapped RPC), get PERMISSION_DENIED and an audit event.
    # At least one ACME or EST subject is required. The old
    # allowedClientSubjects key is removed; setting it fails rendering.
    #
    # Issuer role, requestor namespace "acme::" (IssueCertificate, GetCaInfo,
    # ListProfiles). The audit actor is the verified peer DN; the requestor is
    # recorded as on_behalf_of and must start with "acme::".
    acmeClientSubjects:
      - "CN=acme-server"
    # Issuer role, requestor namespace "est::" (same RPCs as ACME).
    estClientSubjects:
      - "CN=est-server"
    # Admin role, requestor namespace "admin::" or empty: RevokeCertificate,
    # GenerateCrl, CheckRevocationStatus, GetCaInfo, ListProfiles. Never
    # IssueCertificate. Empty by default: no client may revoke, generate CRLs
    # or query revocation status over gRPC until an operator names a dedicated
    # admin identity. Issue one short-lived admin certificate per named CA
    # Operations Staff operator, from the dedicated service-identity CA
    # (client-ca.crt); shared admin certificates are prohibited. A non-empty
    # list requires exactly one trust anchor in client-ca.crt (ca-server
    # refuses to start otherwise). Admin certificates must be issued directly
    # by the client trust anchor: one issued by an intermediate CA under it is
    # refused per call (PERMISSION_DENIED, audited admin_issuer_not_anchor).
    # The chart NetworkPolicy admits only acme/est pods to the gRPC port, so an
    # admin tool connects via kubectl port-forward or a policy you add.
    adminClientSubjects: []
    # Per-namespace end-entity profile allowlists for IssueCertificate, passed
    # ";"-joined as CA_GRPC_{ACME,EST}_ALLOWED_PROFILES. An Issuer client asking
    # for any other profile gets PERMISSION_DENIED and an audit event. CA
    # profiles (e.g. intermediate_ca) are NEVER allowed: rendering fails on
    # intermediate_ca, and ca-server refuses to start on an unknown profile, a
    # CA profile (basic_constraints_ca), or an empty list for a namespace that
    # has client subjects. Admin cannot issue, so there is no admin list.
    acmeAllowedProfiles:
      - "acme-default"
    estAllowedProfiles:
      - "tls_client"
      - "tls_server"
      - "tls_server_client"
      - "efs"

  # CA certificate and key
  # NIST 800-53: SC-12 (Cryptographic Key Establishment)
  caCert:
    # Use existing secret for CA cert/key
    existingSecret: ""
    # Or specify paths (mounted via volumes)
    certFile: ""
    keyFile: ""

  # Approval remains fail-closed by default. Automated integration labs may
  # disable it because cert-manager approval is enforced by usg-est-issuer.
  requireApproval: true

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Extra environment variables
  extraEnv: []

  # Extra volumes and mounts
  extraVolumes: []
  extraVolumeMounts: []

# =============================================================================
# ACME Service (RFC 8555)
# =============================================================================
acme:
  enabled: true
  replicaCount: 2

  image:
    repository: ""
    tag: ""

  service:
    type: ClusterIP
    port: 8080

  # External base URL for ACME directory (e.g. https://acme.example.com)
  baseUrl: ""

  # SSRF guard: when false, orders for private-IP / internal domains are
  # rejected. Keep false in production; only an in-cluster E2E flips it.
  allowPrivateIpDomains: false

  # Port the http-01 challenge validator connects to on the client.
  http01Port: 80

  # Upstream recursive resolvers for dns-01 validation (ACME_DNS01_RESOLVERS):
  # IPv4/IPv6 literals, port 53, at most 8. Empty (default) uses the pod's
  # resolv.conf (cluster DNS); no public third-party resolver is used
  # implicitly (NIST 800-53 CM-6). Invalid entries refuse startup.
  # Production: list the enclave's DNSSEC-validating recursive resolver(s).
  # OstrichPKI does not validate DNSSEC itself; SC-21 is inherited from that
  # resolver (environment assumption, POAM-2026-10-23-41). The CA-to-resolver
  # channel is unauthenticated (no TSIG/DoT, AD bit not checked), so deploy the
  # resolver on a trusted network segment. Cap the resolver's negative-cache
  # TTL (RFC 2308; e.g. unbound cache-max-negative-ttl: 5) so a lookup made
  # before the TXT record propagated is not replayed across the retry window.
  # When networkPolicy.enabled, the acme NetworkPolicy also opens UDP/TCP 53
  # egress to exactly these addresses (/32 or /128).
  # Rendering fails (helm install/upgrade/template) when the value is not a
  # list, has more than 8 entries, repeats an entry, or an entry is not a plain
  # IPv4 dotted-quad / hex IPv6 literal (no '/', port, zone or whitespace).
  # IPv4-mapped IPv6 (::ffff:10.0.0.53) is rejected: list 10.0.0.53 instead.
  # Example: dns01Resolvers: ["10.0.0.53", "10.0.1.53"]
  dns01Resolvers: []

  # mTLS client identity for the CA gRPC API. Required when acme is enabled
  # (rendering fails without clientTls.existingSecret). The certificate subject
  # must be in ca.grpc.acmeClientSubjects (default CN=acme-server) and carry
  # EKU clientAuth. NIST 800-53: SC-8, IA-3; NIAP PP-CA: FCS_TLSC_EXT.2
  caGrpc:
    # TLS server name to verify; empty = host of the CA gRPC URL ("<fullname>-ca").
    serverName: ""
    clientTls:
      # Secret with keys tls.crt, tls.key, ca.crt (trust anchor for the CA
      # gRPC server certificate). Mounted read-only at /app/ca-grpc-client.
      existingSecret: ""
      certFile: /app/ca-grpc-client/tls.crt
      keyFile: /app/ca-grpc-client/tls.key
      caFile: /app/ca-grpc-client/ca.crt

  # Ingress for external ACME access
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: acme.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# EST Service (RFC 7030)
# =============================================================================
est:
  enabled: true
  replicaCount: 1

  image:
    repository: ""
    tag: ""

  service:
    type: ClusterIP
    port: 8443

  # Accept bearer-token auth in addition to mTLS (RFC 7030 §3.2).
  allowBearerAuth: true
  # Permit HTTP Basic only as a TLS-protected bootstrap fallback.
  allowBasicAuth: false
  # Optional least-privilege Basic bootstrap account created by the explicit
  # CA bootstrap Job. The role is fixed to EstEnrollee (SubmitRequest only).
  basicBootstrap:
    username: ""
    existingSecret: ""
    passwordKey: est-enrollee-password

  # mTLS configuration (required per RFC 7030)
  # NIST 800-53: SC-8 (Transmission Confidentiality)
  tls:
    existingSecret: ""
    certFile: ""
    keyFile: ""
    caCertFile: ""

  # mTLS client identity for the CA gRPC API. Required when est is enabled
  # (rendering fails without clientTls.existingSecret). The certificate subject
  # must be in ca.grpc.estClientSubjects (default CN=est-server) and carry
  # EKU clientAuth. NIST 800-53: SC-8, IA-3; NIAP PP-CA: FCS_TLSC_EXT.2
  caGrpc:
    # TLS server name to verify; empty = host of the CA gRPC URL ("<fullname>-ca").
    serverName: ""
    clientTls:
      # Secret with keys tls.crt, tls.key, ca.crt. Mounted read-only at
      # /app/ca-grpc-client.
      existingSecret: ""
      certFile: /app/ca-grpc-client/tls.crt
      keyFile: /app/ca-grpc-client/tls.key
      caFile: /app/ca-grpc-client/ca.crt

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# NPE Portal (Non-Person Entity enrollment portal; mTLS BFF + React SPA)
# =============================================================================
npePortal:
  enabled: true
  # Active-active behind the load balancer (IL5 posture).
  replicaCount: 2

  image:
    repository: npe-portal
    tag: ""

  service:
    type: ClusterIP
    port: 8443

  # Development escape hatch only: serve without mandatory mTLS. NEVER set true
  # in production — the OID->role authentication requires a verified client cert.
  allowInsecure: false

  # mTLS material. existingSecret mounts server cert/key + client CA at /app/certs;
  # the *File paths point into that mount. SC-8 / IA-2.
  tls:
    existingSecret: ""
    certFile: "/app/certs/tls.crt"
    keyFile: "/app/certs/tls.key"
    clientCaFile: "/app/certs/client-ca.crt"

  # Portal config (rendered to npe-portal.json) unless existingConfigMap is set.
  # Backends are reached over the in-cluster service DNS; production sets the
  # backend mTLS material so the identity bridge runs authenticated.
  existingConfigMap: ""
  config:
    backend:
      caUrl: "https://ostrich-pki-ca:8080"
      estUrl: "https://ostrich-pki-est:8443"
    session:
      cookieName: "ostrich_npe_session"
      inactivityTimeoutSecs: 1800
      absoluteTimeoutSecs: 28800
      secureCookies: true
    oidMapping:
      sponsorOids: ["2.16.840.1.101.2.1.11.42"]
      adminOid: "2.16.840.1.101.2.1.11.43"
      raOids: ["2.16.840.1.101.2.1.11.44"]
      caaOids: ["2.16.840.1.101.2.1.11.45"]
      allowedIssuers: ["CN=Example NPE Issuing CA,O=U.S. Government,C=US"]
    classificationBanner: "CUI"
    cspNonceLength: 16
    staticFiles:
      directory: "/app/static"
      urlPrefix: "/static"

  # Per-network ingress hosts (e.g. npe.<niprnet-domain> / npe.<sipr-domain>).
  #
  # CRITICAL: the portal terminates mTLS itself and derives the operator's role
  # from the client certificate. The ingress MUST pass the TLS connection through
  # to the portal (ssl-passthrough) — do NOT let the ingress terminate TLS, or it
  # strips the client certificate and every request fails authentication (IA-2).
  # Set the passthrough annotation for your controller (e.g. for ingress-nginx:
  # nginx.ingress.kubernetes.io/ssl-passthrough: "true"), and leave `tls` empty
  # (a `tls` block here implies the ingress re-terminates TLS — incompatible with
  # mTLS passthrough).
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: npe.oopl.dev.mil
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# OCSP Responder (RFC 6960)
# =============================================================================
ocsp:
  enabled: true
  replicaCount: 2

  image:
    repository: ""
    tag: ""

  service:
    type: ClusterIP
    port: 8081

  # OCSP signing certificate
  signing:
    existingSecret: ""
    certFile: ""
    keyFile: ""

  # Ingress for external OCSP access
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ocsp.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# SCMS Service (Smartcard Management)
# =============================================================================
scms:
  enabled: false  # Disabled by default
  replicaCount: 1

  image:
    repository: ""
    tag: ""

  service:
    type: ClusterIP
    port: 8082

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# KRA Service (Key Recovery Authority)
# =============================================================================
kra:
  enabled: false  # Disabled by default
  replicaCount: 1

  image:
    repository: ""
    tag: ""

  service:
    type: ClusterIP
    port: 8083

  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# =============================================================================
# PostgreSQL Database
# =============================================================================
postgresql:
  enabled: true
  auth:
    username: ostrich
    password: ""  # Set this or use existingSecret
    database: ostrich_pki
    existingSecret: ""
  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

# External database (if postgresql.enabled=false)
externalDatabase:
  host: ""
  port: 5432
  user: ostrich
  password: ""
  database: ostrich_pki
  # External database transport fails closed unless the operator explicitly
  # selects another libpq sslmode. The bundled in-cluster PostgreSQL dependency
  # is handled separately with sslmode=disable because it has no TLS listener.
  sslMode: require
  existingSecret: ""
  existingSecretPasswordKey: password

# =============================================================================
# Logging Configuration
# =============================================================================
logging:
  # Log level: trace, debug, info, warn, error
  level: info
  # Use JSON format for structured logging
  json: true

# =============================================================================
# Monitoring
# =============================================================================
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

# =============================================================================
# Network Policies (NIST 800-53: SC-7)
# =============================================================================
networkPolicy:
  enabled: true
  # Namespace whose k8s-app=kube-dns pods every policy may reach on port 53.
  # Default "" keeps the historical behaviour: kube-dns-labelled pods in ANY
  # namespace. Recommended hardening (NIST 800-53 SC-7): set it to
  # "kube-system" (or the namespace that runs your cluster DNS) so a pod
  # labelled k8s-app=kube-dns elsewhere cannot receive the services' DNS
  # queries. Matched via the kubernetes.io/metadata.name label (Kubernetes
  # >= 1.22). A wrong namespace blocks DNS for every OstrichPKI pod.
  dnsNamespace: ""
  # Allow ingress from specified namespaces
  ingressNamespaceLabels: {}
  # Allow egress to external services
  egressRules: []
