{{/*
OstrichPKI Network Policies

COMPLIANCE MAPPING:
- NIST 800-53: SC-7 (Boundary Protection)
- NIST 800-53: AC-4 (Information Flow Enforcement)
*/}}
{{- if .Values.networkPolicy.enabled -}}
---
# CA Service Network Policy
{{- if .Values.ca.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostrich-pki.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ostrich-pki.labels" . | nindent 4 }}
    app.kubernetes.io/component: ca
spec:
  podSelector:
    matchLabels:
      {{- include "ostrich-pki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ca
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # REST: allow traffic from other OstrichPKI services
    - from:
        - podSelector:
            matchLabels:
              {{- include "ostrich-pki.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ca.rest.port }}
    # gRPC issuance API: only the RA front ends (acme, est) may connect.
    # Defence in depth in front of mTLS + the per-role, per-method gRPC
    # authorization (ca.grpc.*ClientSubjects). Admin-role tools are not
    # admitted here; they connect via kubectl port-forward or an
    # operator-supplied NetworkPolicy.
    # NIST 800-53: AC-4, SC-7, AC-6
    - from:
        - podSelector:
            matchLabels:
              {{- include "ostrich-pki.selectorLabels" . | nindent 14 }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - acme
                  - est
      ports:
        - protocol: TCP
          port: {{ .Values.ca.grpc.port }}
    # Allow traffic from ingress namespace if specified
    {{- if .Values.networkPolicy.ingressNamespaceLabels }}
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.ca.rest.port }}
    {{- end }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {{ include "ostrich-pki.dnsNamespaceSelector" . }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow database access
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    {{- with .Values.networkPolicy.egressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
---
# ACME Service Network Policy
{{- if .Values.acme.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostrich-pki.fullname" . }}-acme
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ostrich-pki.labels" . | nindent 4 }}
    app.kubernetes.io/component: acme
spec:
  podSelector:
    matchLabels:
      {{- include "ostrich-pki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: acme
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow external ACME traffic
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS (cluster DNS is the dns-01 resolver when acme.dns01Resolvers
    # is empty). TCP 53 is needed for the resolver's TCP fallback on truncated
    # TXT answers (RFC 8555 §8.4 dns-01 validation).
    - to:
        - namespaceSelector: {{ include "ostrich-pki.dnsNamespaceSelector" . }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- /* Fails rendering on any malformed, mapped, duplicate or 9th+ entry. */}}
    {{- $_ := include "ostrich-pki.acmeDns01Resolvers" . }}
    {{- with .Values.acme.dns01Resolvers }}
    # dns-01 upstream recursive resolvers (ACME_DNS01_RESOLVERS): port 53 only,
    # to exactly the configured addresses (/32 or /128). NIST 800-53: SC-7, CM-6
    - to:
        {{- range . }}
        - ipBlock:
            cidr: {{ printf "%s/%s" . (ternary "128" "32" (contains ":" .)) | quote }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Allow CA service access
    - to:
        - podSelector:
            matchLabels:
              {{- include "ostrich-pki.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: ca
      ports:
        - protocol: TCP
          port: {{ .Values.ca.grpc.port }}
    # Allow database access
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # Allow external HTTP for challenge validation (http-01, tls-alpn-01).
    # Public IPv4 only: private, shared, loopback, link-local (incl. cloud
    # metadata 169.254.169.254), benchmarking, multicast and reserved ranges
    # are excluded as defence in depth behind the validator's SSRF guard.
    # No IPv6 peer is opened, so IPv6-only challenge targets fail closed.
    # NIST 800-53: SC-7, AC-4
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8         # "this network" (RFC 791)
              - 10.0.0.0/8        # private (RFC 1918)
              - 100.64.0.0/10     # shared address space / CGNAT (RFC 6598)
              - 127.0.0.0/8       # loopback (RFC 1122)
              - 169.254.0.0/16    # link-local, cloud metadata (RFC 3927)
              - 172.16.0.0/12     # private (RFC 1918)
              - 192.0.0.0/24      # IETF protocol assignments (RFC 6890)
              - 192.168.0.0/16    # private (RFC 1918)
              - 198.18.0.0/15     # benchmarking (RFC 2544)
              - 224.0.0.0/4       # multicast (RFC 5771)
              - 240.0.0.0/4       # reserved + limited broadcast (RFC 1112)
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
{{- end }}
---
# OCSP Service Network Policy
{{- if .Values.ocsp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ostrich-pki.fullname" . }}-ocsp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ostrich-pki.labels" . | nindent 4 }}
    app.kubernetes.io/component: ocsp
spec:
  podSelector:
    matchLabels:
      {{- include "ostrich-pki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ocsp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # OCSP should be publicly accessible for certificate validation
    - ports:
        - protocol: TCP
          port: 8081
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {{ include "ostrich-pki.dnsNamespaceSelector" . }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow database access
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- end }}
