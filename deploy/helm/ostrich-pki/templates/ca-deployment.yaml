{{/*
OstrichPKI CA Service Deployment

COMPLIANCE MAPPING:
- NIST 800-53: SC-17 (PKI Certificates)
- NIST 800-53: SC-12 (Cryptographic Key Establishment)
- NIST 800-53: AC-6 (Least Privilege)
- NIST 800-53: SC-8, AC-17, IA-3, AC-3 (gRPC listener is TLS 1.3 mTLS with a
  per-role client-subject lists and per-method authorization; rendering fails
  without the gRPC TLS secret or with an invalid/overlapping client list)
- NIST 800-53: AC-5, AC-6 (issuer identities cannot revoke; admin cannot issue)
- NIST 800-53: AC-3, AC-6, CM-7 (Issuer clients limited to their namespace's
  end-entity profile allowlist; CA profiles never allowed)
- NIAP PP-CA: FTP_ITC.1, FCS_TLSS_EXT.2, FDP_ACF.1, FMT_SMR.2
*/}}
{{- if .Values.ca.enabled -}}
{{- $grpcTlsSecret := required "ca.grpc.tls.existingSecret is required: the CA gRPC API only serves TLS 1.3 mTLS and refuses to start without a certificate, key and client CA (see docs/runbooks/ca-grpc-mtls.md)" .Values.ca.grpc.tls.existingSecret }}
{{- include "ostrich-pki.caGrpcClientPolicy" . }}
{{- $grpcAcmeSubjects := include "ostrich-pki.caGrpcClientSubjects" (dict "key" "acmeClientSubjects" "subjects" .Values.ca.grpc.acmeClientSubjects) }}
{{- $grpcEstSubjects := include "ostrich-pki.caGrpcClientSubjects" (dict "key" "estClientSubjects" "subjects" .Values.ca.grpc.estClientSubjects) }}
{{- $grpcAdminSubjects := include "ostrich-pki.caGrpcClientSubjects" (dict "key" "adminClientSubjects" "subjects" .Values.ca.grpc.adminClientSubjects) }}
{{- $grpcAcmeProfiles := include "ostrich-pki.caGrpcAllowedProfiles" (dict "key" "acmeAllowedProfiles" "profiles" .Values.ca.grpc.acmeAllowedProfiles) }}
{{- $grpcEstProfiles := include "ostrich-pki.caGrpcAllowedProfiles" (dict "key" "estAllowedProfiles" "profiles" .Values.ca.grpc.estAllowedProfiles) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ostrich-pki.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ostrich-pki.labels" . | nindent 4 }}
    app.kubernetes.io/component: ca
spec:
  replicas: {{ .Values.ca.replicaCount }}
  selector:
    matchLabels:
      {{- include "ostrich-pki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ca
  template:
    metadata:
      labels:
        {{- include "ostrich-pki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ca
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ostrich-pki.serviceAccountName" . }}
      securityContext:
        {{- include "ostrich-pki.podSecurityContext" . | nindent 8 }}
      {{- if .Values.ca.bootstrap.enabled }}
      initContainers:
        {{- include "ostrich-pki.waitForCa" . | nindent 8 }}
      {{- end }}
      containers:
        - name: ca
          securityContext:
            {{- include "ostrich-pki.securityContext" . | nindent 12 }}
          image: {{ include "ostrich-pki.image" (dict "service" "ca" "repository" .Values.ca.image.repository "tag" .Values.ca.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ca.rest.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.ca.grpc.port }}
              protocol: TCP
          env:
            {{- include "ostrich-pki.commonEnv" . | nindent 12 }}
            - name: CA_REST_ADDRESS
              value: "0.0.0.0:{{ .Values.ca.rest.port }}"
            - name: CA_GRPC_ADDRESS
              value: "0.0.0.0:{{ .Values.ca.grpc.port }}"
            # gRPC mTLS (TLS 1.3, aws-lc-rs FIPS). No insecure/plaintext flag
            # is ever set here; release images refuse it.
            - name: CA_GRPC_TLS_CERT_FILE
              value: {{ .Values.ca.grpc.tls.certFile | quote }}
            - name: CA_GRPC_TLS_KEY_FILE
              value: {{ .Values.ca.grpc.tls.keyFile | quote }}
            - name: CA_GRPC_TLS_CLIENT_CA_FILE
              value: {{ .Values.ca.grpc.tls.clientCaFile | quote }}
            # Per-role client subject lists (";"-joined). Admin is always
            # rendered; "" = no client may revoke, generate CRLs or query
            # revocation status over gRPC.
            - name: CA_GRPC_ACME_CLIENT_SUBJECTS
              value: {{ $grpcAcmeSubjects | quote }}
            - name: CA_GRPC_EST_CLIENT_SUBJECTS
              value: {{ $grpcEstSubjects | quote }}
            - name: CA_GRPC_ADMIN_CLIENT_SUBJECTS
              value: {{ $grpcAdminSubjects | quote }}
            # Per-namespace end-entity profile allowlists (";"-joined); CA
            # profiles are never allowed (rendering and ca-server both refuse).
            - name: CA_GRPC_ACME_ALLOWED_PROFILES
              value: {{ $grpcAcmeProfiles | quote }}
            - name: CA_GRPC_EST_ALLOWED_PROFILES
              value: {{ $grpcEstProfiles | quote }}
            - name: CA_REQUIRE_APPROVAL
              value: {{ .Values.ca.requireApproval | quote }}
            {{- if .Values.ca.hsm.existingSecret }}
            - name: PKCS11_MODULE_PATH
              value: {{ .Values.ca.hsm.modulePath | quote }}
            - name: PKCS11_PIN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ca.hsm.existingSecret }}
                  key: {{ .Values.ca.hsm.pinKey }}
            {{- end }}
            {{- if .Values.ca.caCert.certFile }}
            - name: CA_CERT_FILE
              value: {{ .Values.ca.caCert.certFile | quote }}
            {{- end }}
            {{- if .Values.ca.caCert.keyFile }}
            - name: CA_KEY_FILE
              value: {{ .Values.ca.caCert.keyFile | quote }}
            {{- end }}
            {{- with .Values.ca.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.ca.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: grpc-tls
              mountPath: /app/grpc-tls
              readOnly: true
            {{- if .Values.ca.caCert.existingSecret }}
            - name: ca-certs
              mountPath: /app/certs
              readOnly: true
            {{- end }}
            {{- with .Values.ca.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.ca.hsm.tokenPersistence.enabled }}
            - name: hsm-tokens
              mountPath: /app/tokens
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: grpc-tls
          secret:
            secretName: {{ $grpcTlsSecret }}
            defaultMode: 0440
        {{- if .Values.ca.caCert.existingSecret }}
        - name: ca-certs
          secret:
            secretName: {{ .Values.ca.caCert.existingSecret }}
        {{- end }}
        {{- with .Values.ca.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.ca.hsm.tokenPersistence.enabled }}
        - name: hsm-tokens
          persistentVolumeClaim:
            claimName: {{ include "ostrich-pki.hsmClaimName" . }}
        {{- end }}
      {{- with .Values.ca.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ca.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ca.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
