{{/*
OstrichPKI ACME Service Deployment

COMPLIANCE MAPPING:
- RFC 8555: ACME Protocol
- NIST 800-53: SC-17 (PKI Certificates)
- NIST 800-53: SC-8, AC-17, IA-3 (CA gRPC client over TLS 1.3 mTLS; rendering
  fails without the client certificate secret)
- NIAP PP-CA: FCS_TLSC_EXT.2, FTP_ITC.1
*/}}
{{- if .Values.acme.enabled -}}
{{- $caGrpcClientSecret := include "ostrich-pki.caGrpcClientSecret" (dict "component" "acme" "cfg" .Values.acme.caGrpc) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ostrich-pki.fullname" . }}-acme
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ostrich-pki.labels" . | nindent 4 }}
    app.kubernetes.io/component: acme
spec:
  replicas: {{ .Values.acme.replicaCount }}
  selector:
    matchLabels:
      {{- include "ostrich-pki.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: acme
  template:
    metadata:
      labels:
        {{- include "ostrich-pki.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: acme
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ostrich-pki.serviceAccountName" . }}
      securityContext:
        {{- include "ostrich-pki.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "ostrich-pki.waitForCa" . | nindent 8 }}
      containers:
        - name: acme
          securityContext:
            {{- include "ostrich-pki.securityContext" . | nindent 12 }}
          image: {{ include "ostrich-pki.image" (dict "service" "acme" "repository" .Values.acme.image.repository "tag" .Values.acme.image.tag "root" .) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- include "ostrich-pki.commonEnv" . | nindent 12 }}
            - name: ACME_BIND_ADDRESS
              value: "0.0.0.0:8080"
            # CA gRPC over TLS 1.3 mTLS (client cert from acme.caGrpc.clientTls).
            # CA_GRPC_INSECURE is deliberately never set (fail closed).
            {{- include "ostrich-pki.caGrpcClientEnv" (dict "cfg" .Values.acme.caGrpc "root" .) | nindent 12 }}
            - name: ACME_ALLOW_PRIVATE_IP_DOMAINS
              value: {{ .Values.acme.allowPrivateIpDomains | quote }}
            - name: ACME_HTTP01_PORT
              value: {{ .Values.acme.http01Port | quote }}
            {{- with .Values.acme.dns01Resolvers }}
            - name: ACME_DNS01_RESOLVERS
              value: {{ include "ostrich-pki.acmeDns01Resolvers" $ | quote }}
            {{- end }}
            {{- if .Values.acme.baseUrl }}
            - name: ACME_BASE_URL
              value: {{ .Values.acme.baseUrl | quote }}
            {{- end }}
            {{- with .Values.acme.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.acme.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: ca-grpc-client
              mountPath: /app/ca-grpc-client
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: ca-grpc-client
          secret:
            secretName: {{ $caGrpcClientSecret }}
            defaultMode: 0440
      {{- with .Values.acme.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.acme.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.acme.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
