# NetworkPolicy for the CA gRPC issuance API (50051).
#
# Mirrors the Helm chart's CA NetworkPolicy gRPC rule
# (deploy/helm/ostrich-pki/templates/networkpolicy.yaml): only the RA front ends
# (acme-server, est-server pods) may open a TCP connection to the gRPC port.
# This is defence in depth in front of TLS 1.3 mTLS + the client-subject
# allowlist, and it keeps arbitrary in-cluster pods from holding the CA's
# pre-handshake connection slots (SEC-002). The REST port (8080) is left
# reachable as before: it carries its own authentication, and the ingress
# controller, npe-portal and web-ui consumers live outside this base. Kubelet
# health probes come from the host and are allowed by Cilium's default host
# policy.
#
# This policy restricts INGRESS only (egress to Postgres/NATS/HSM is unchanged).
#
# COMPLIANCE MAPPING:
# - NIST 800-53: AC-4 (Information Flow Enforcement), SC-7 (Boundary
#   Protection), AC-6 (Least Privilege), AC-17
# - NIAP PP-CA: none (not a TOE SFR). Network segmentation is an operational
#   environment (OE) control, mapped to NIST AC-4 / SC-7 above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ca-restrict-grpc-port
  namespace: ostrich-pki
  labels:
    app.kubernetes.io/part-of: ostrich-pki
spec:
  podSelector:
    matchLabels:
      app: ca-server
  policyTypes:
    - Ingress
  ingress:
    # 50051 (gRPC issuance API, mTLS): only acme-server and est-server pods.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - acme-server
                  - est-server
      ports:
        - protocol: TCP
          port: 50051
    # 8080 (REST API, authenticated): unchanged, reachable as before.
    - ports:
        - protocol: TCP
          port: 8080
