# OstrichPKI CA Service Deployment
#
# COMPLIANCE MAPPING:
# - NIST 800-53: SC-17 (PKI Certificates) — this is the CA core
# - NIST 800-53: SC-12 (Key management) — CA key in HSM/SoftHSM
# - NIST 800-53: CM-2 (Baseline Configuration)
# - NIST 800-53: SC-8, AC-17, IA-3, AC-3 — gRPC (50051) is TLS 1.3 mTLS with a
#   per-role client-subject lists + per-method authz (aws-lc-rs FIPS). NIAP PP-CA: FTP_ITC.1
#
# Requires the out-of-band secret `ca-grpc-tls` (tls.crt = server chain with
# SAN DNS:ca-service, tls.key, client-ca.crt = the DEDICATED service-identity
# CA that issued the acme/est gRPC client certs and nothing else; ca-server
# refuses to start if client-ca.crt contains its own subscriber-issuing CA).
# Without it the pod stays in ContainerCreating and the CA never serves gRPC in
# plaintext. ca-networkpolicy.yaml limits 50051 to acme/est pods. See
# docs/runbooks/ca-grpc-mtls.md.
#
# Per-service image published by .github/workflows/docker-publish.yml
# (ghcr.io/192d-wing/ca-service). Deployment/Service names match the running
# cluster (ca-server / ca-service); environment-specific overlays (hostnames,
# ingress, the .61 VIP) live outside this base.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ca-server
  namespace: ostrich-pki
  labels:
    app: ca-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ca-server
  template:
    metadata:
      labels:
        app: ca-server
    spec:
      serviceAccountName: ostrich-pki
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ca-server
          image: ghcr.io/192d-wing/ca-service:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 50051 }
          env:
            - { name: RUST_LOG, value: "info" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ostrich-secrets
                  key: DATABASE_URL
            - { name: CA_REST_ADDRESS, value: "0.0.0.0:8080" }
            - { name: CA_GRPC_ADDRESS, value: "0.0.0.0:50051" }
            # gRPC mTLS (release images refuse any plaintext dev flag).
            - { name: CA_GRPC_TLS_CERT_FILE, value: "/app/grpc-tls/tls.crt" }
            - { name: CA_GRPC_TLS_KEY_FILE, value: "/app/grpc-tls/tls.key" }
            - { name: CA_GRPC_TLS_CLIENT_CA_FILE, value: "/app/grpc-tls/client-ca.crt" }
            # Per-role ";"-delimited RFC 4514 DN lists (one role per DN). ACME/EST:
            # Issue + reads, requestor bound to acme::/est::. ADMIN: revoke, CRL,
            # status + reads, never Issue; empty = no one may revoke over gRPC.
            # Unlisted clients and unmapped RPCs get PERMISSION_DENIED.
            - { name: CA_GRPC_ACME_CLIENT_SUBJECTS, value: "CN=acme-server" }
            - { name: CA_GRPC_EST_CLIENT_SUBJECTS, value: "CN=est-server" }
            - { name: CA_GRPC_ADMIN_CLIENT_SUBJECTS, value: "" }
            # Per-namespace ";"-delimited end-entity profiles the ACME / EST
            # Issuer clients may request (else PERMISSION_DENIED + audit). CA
            # profiles (e.g. intermediate_ca) are never allowed; ca-server
            # refuses to start on an unknown or CA profile or an empty list.
            - { name: CA_GRPC_ACME_ALLOWED_PROFILES, value: "acme-default" }
            - { name: CA_GRPC_EST_ALLOWED_PROFILES, value: "tls_client;tls_server;tls_server_client;efs" }
            # Expiry-notify producer -> NATS over TLS with password auth. Only used
            # when NOTIFY_ENABLED=true (set per-environment). NATS_USER/PASSWORD come
            # from the nats-auth secret; the CA verifies the server against
            # NATS_CA_FILE (mounted from nats-client-ca). SC-8/SC-13, AC-3/IA-2.
            - { name: NATS_URL, value: "tls://nats:4222" }
            - { name: NATS_CA_FILE, value: "/etc/nats-ca/ca.crt" }
            - name: NATS_USER
              valueFrom: { secretKeyRef: { name: nats-auth, key: NATS_USER } }
            - name: NATS_PASSWORD
              valueFrom: { secretKeyRef: { name: nats-auth, key: NATS_PASSWORD } }
          volumeMounts:
            - { name: nats-client-ca, mountPath: /etc/nats-ca, readOnly: true }
            - { name: grpc-tls, mountPath: /app/grpc-tls, readOnly: true }
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: nats-client-ca
          secret:
            secretName: nats-client-ca
        - name: grpc-tls
          secret:
            secretName: ca-grpc-tls
            defaultMode: 0440
